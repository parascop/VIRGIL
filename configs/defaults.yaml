# Shared defaults. Every profile_*.yaml is deep-merged on top of this file, and
# cameras.yaml may override heuristic thresholds per camera via `thresholds:`.
# Nothing in the code base hard-codes a heuristic threshold: all live here.
name: defaults
timezone: Asia/Kolkata
logging:
  level: INFO
  debug: false
paths:
  sqlite: data/vigil.db
  chroma: data/chroma
  keyframes: data/keyframes
  live: data/live
  clips: data/clips
  jobs: data/jobs
  cache: data/cache          # model/artifact cache (CLIP, Ultralytics settings)
torch_device: auto           # auto = cuda -> mps -> cpu
detector:
  model: models/yolov8n.pt
  device: auto               # auto | cpu | cuda:0 | mps
  imgsz: 640
  conf: 0.10               # low on purpose: ByteTrack needs low-score boxes (new tracks still need >= 0.25)
  iou: 0.50
  tracker: bytetrack.yaml
  half: false
  classes: [0, 24, 26, 28]   # person, backpack, handbag, suitcase (COCO ids)
  class_names: {0: person, 24: backpack, 26: handbag, 28: suitcase}
  track_lost_timeout_s: 1.5  # drop a track from the book after this long unseen
ingest:
  target_fps: 10
  queue_maxsize: 30          # drop-oldest when live; blocking when offline
  ring_seconds: 4.0
  stale_after_s: 5.0         # no frame for this long => camera "unavailable"
  reconnect:
    initial_s: 1.0
    factor: 2.0
    max_s: 30.0
    max_attempts: 0          # 0 = retry forever
  sparse_index:
    enabled: false           # CLIP-only keyframe every interval_s (searchable "frames")
    interval_s: 3.0
vlm:
  enabled: true
  base_url: http://localhost:11434
  model: moondream           # overwritten by scripts/benchmark_models.py
  num_ctx: 2048
  temperature: 0
  num_predict: 120
  keep_alive: 10m
  num_gpu: null              # null = let Ollama decide
  timeout_s: 45              # read timeout of one request
  connect_timeout_s: 3
  retries: 1                 # invalid structured output is retried at most this often
  queue_maxsize: 4
  queue_overflow: lowest_priority   # lowest_priority | drop_oldest | reject_new
  composite_frames: 4
  composite_span_s: 3.0
  composite_max_side: 512
  allow_reclassify: true     # VLM may change the category (e.g. fighting -> suspicious)
  unavailable_cooldown_s: 20 # after a connection failure skip the VLM for this long
confidence:
  heuristic_weight: 0.4      # uncalibrated ranking heuristic, NOT a probability
  vlm_weight: 0.6
embeddings:
  model: ViT-B-32
  pretrained: openai
  device: cpu
  persist_queue_maxsize: 16
retrieval:
  mode: hybrid               # image | summary | hybrid
  image_weight: 0.6
  summary_weight: 0.4
  normalization: minmax      # minmax | fixed (see vigil/query.py)
  fixed_ranges: {image: [0.15, 0.35], summary: [0.30, 0.90]}
  max_candidates: 2000
query:
  llm_parser: true
  llm_timeout_s: 6
cooldown_s: 30
status_write_interval_s: 1.0
live_frame_interval_s: 0.2
live_jpeg_quality: 80
categories:                  # trigger_type -> target category
  person_down: person down
  fighting: fighting
  tailgating: tailgating
  crowd_count: crowd incident
  crowd_dispersal: crowd incident
  loitering: suspicious activity
  zone_entry: suspicious activity
  abandoned_object: suspicious activity
heuristics:
  emit_interval_s: 1.0       # re-emit a persisting candidate at most this often
  person_down:
    enabled: true
    ar_upright_max: 0.8      # width/height below this = upright
    ar_down_min: 1.2         # width/height above this = horizontal
    transition_window_s: 1.5
    min_drop_height_ratio: 0.15   # centroid must move down >= ratio * upright height
    full_drop_height_ratio: 0.5   # drop that earns a full displacement score
    hold_s: 2.0              # horizontal + stationary for at least this long
    ar_hold_min: 1.0
    stationary_speed_max: 0.35    # body-heights per second
    velocity_window_s: 0.5
    smoothing_window: 3      # median filter over box aspect ratio (detector jitter)
    max_gap_s: 0.6           # tolerate brief occlusion/missed detections
    reassociate: true        # a new, already-horizontal track near a just-lost upright one inherits it
    reassoc_max_dist_heights: 1.5
    min_track_age_s: 0.5
    weights: {persistence: 0.4, displacement: 0.3, stillness: 0.3}
  fighting:
    enabled: true
    iou_min: 0.05
    distance_height_ratio: 0.8    # centroid distance < ratio * mean box height
    min_duration_s: 1.0
    motion_energy_min: 0.8        # relative motion (body-heights/s); preliminary, tune per camera
    bbox_change_weight: 0.5
    velocity_window_s: 0.4
    grace_s: 0.4
    weights: {energy: 0.5, duration: 0.3, closeness: 0.2}
  tailgating:
    enabled: true
    window_s: 1.5            # second crossing within this window after the first
    min_track_age_s: 0.3
  crowd:
    enabled: true
    crowd_count: 6
    min_duration_s: 1.0
    dispersal:
      enabled: true
      min_tracks: 3
      speed_ratio: 2.5       # current mean speed / rolling baseline
      min_speed: 0.8         # absolute floor (body-heights/s)
      baseline_s: 10.0
      baseline_min_s: 3.0
      window_s: 2.0
      velocity_window_s: 0.5
  suspicious:
    enabled: true
    loiter_s: 10.0
    prohibited_min_s: 0.3
    exit_grace_s: 0.5
    abandoned:
      enabled: false         # stretch feature
      classes: [backpack, handbag, suitcase]
      stationary_s: 20.0
      stationary_move_ratio: 0.3   # max movement in object-heights
      owner_radius_ratio: 1.5      # a person within this many object-widths = owner nearby
